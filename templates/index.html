<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldCheck | Password Strength</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: radial-gradient(circle at center, #f4f7f6 0%, #dce3e6 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            animation: slideUp 0.6s ease-out;
            z-index: 10;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; transition: border-color 0.3s; }
        input:focus { border-color: #4a90e2; outline: none; }
        
        .input-group { position: relative; margin: 10px 0; }
        .toggle-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; font-size: 18px; user-select: none; }
        
        .meter { height: 8px; background: #eee; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .meter-fill { height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s; }
        
        .info { font-size: 14px; color: #666; margin: 5px 0; transition: all 0.3s; }
        #strength { transition: color 0.3s; display: inline-block; }
        .pop { animation: pop 0.3s ease-out; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .issues { font-size: 13px; color: #d9534f; padding-left: 20px; list-style-type: none; padding-left: 0; }
        .issues li { margin-bottom: 5px; animation: fadeIn 0.4s ease-in forwards; opacity: 0; }
        @keyframes fadeIn { to { opacity: 1; transform: translateX(5px); } }

        .suggestion-box { 
            margin-top: 20px; 
            padding: 15px; 
            background: #e7f3ff; 
            border-left: 4px solid #4a90e2; 
            border-radius: 4px; 
            display: none; 
            animation: slideUp 0.4s ease-out;
        }
        .suggestion-box strong { display: block; margin-bottom: 5px; color: #2c3e50; }
        .suggestion-value { font-family: monospace; background: #fff; padding: 5px; border: 1px solid #b3d7ff; border-radius: 3px; word-break: break-all; }
        .copy-btn { cursor: pointer; background: #4a90e2; color: white; border: none; padding: 8px 12px; border-radius: 4px; margin-top: 10px; font-size: 12px; transition: background 0.3s, transform 0.1s; }
        .copy-btn:hover { background: #357abd; }
        .copy-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="card">
        <h2>ShieldCheck</h2>
        <div class="input-group">
            <input type="password" id="password" placeholder="Type a password..." oninput="checkPassword()">
            <span class="toggle-btn" id="toggleBtn" onclick="toggleVisibility()">👁️</span>
        </div>
        
        <div class="meter"><div id="fill" class="meter-fill"></div></div>
        <div class="info">Strength: <strong id="strength">N/A</strong></div>
        <div class="info">Entropy: <span id="entropy">0</span> bits</div>
        
        <ul id="issues" class="issues"></ul>

        <div id="suggestionBox" class="suggestion-box">
            <strong>Try this stronger version:</strong>
            <div id="suggestion" class="suggestion-value"></div>
            <button class="copy-btn" onclick="copySuggestion()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        async function checkPassword() {
            const password = document.getElementById('password').value;
            const fill = document.getElementById('fill');
            const strengthEl = document.getElementById('strength');
            const entropyEl = document.getElementById('entropy');
            const issuesEl = document.getElementById('issues');
            const suggestionBox = document.getElementById('suggestionBox');
            const suggestionEl = document.getElementById('suggestion');

            if (!password) {
                fill.style.width = '0%';
                strengthEl.innerText = 'N/A';
                entropyEl.innerText = '0';
                issuesEl.innerHTML = '';
                suggestionBox.style.display = 'none';
                return;
            }

            const response = await fetch('/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await response.json();

            // Animation trigger if strength changed
            if (strengthEl.innerText !== data.strength) {
                strengthEl.classList.remove('pop');
                void strengthEl.offsetWidth; // Trigger reflow
                strengthEl.classList.add('pop');
            }

            // Update UI
            strengthEl.innerText = data.strength;
            entropyEl.innerText = data.entropy;
            
            // Update Meter Color
            let color = '#d9534f';
            if (data.strength === 'Medium') { color = '#f0ad4e'; }
            if (data.strength === 'Moderate') { color = '#5bc0de'; }
            if (data.strength === 'Strong') { color = '#5cb85c'; width = '100%'; }

            // Calculate dynamic width based on entropy (capped at 100 bits for 100%)
            let width = Math.min(100, (data.entropy / 100) * 100) + '%';
            
            fill.style.width = width;
            fill.style.background = color;
            strengthEl.style.color = color;

            // Show issues
            issuesEl.innerHTML = data.issues.map(i => `<li>${i}</li>`).join('');

            // Handle Suggestion
            if (data.suggestion && data.strength !== 'Strong') {
                suggestionBox.style.display = 'block';
                suggestionEl.innerText = data.suggestion;
            } else {
                suggestionBox.style.display = 'none';
            }
        }

        function toggleVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggleBtn');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '🔒';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function copySuggestion() {
            const suggestion = document.getElementById('suggestion').innerText;
            const btn = document.querySelector('.copy-btn');
            navigator.clipboard.writeText(suggestion);
            
            const originalText = btn.innerText;
            btn.innerText = '✅ Copied!';
            btn.style.background = '#5cb85c';
            setTimeout(() => { btn.innerText = originalText; btn.style.background = '#4a90e2'; }, 2000);
        }

        // Particle Background Logic
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(74, 144, 226, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = (canvas.width * canvas.height) / 15000;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw connections
            ctx.strokeStyle = 'rgba(74, 144, 226, 0.05)';
            ctx.lineWidth = 1;

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
